plugins {
	id 'com.android.application'
}

android {
	namespace 'com.brokenphysics.issb'
	compileSdkVersion 36
	ndkVersion '28.2.13676358'

	defaultConfig {
		applicationId "com.brokenphysics.issb"
		minSdkVersion 23
		targetSdkVersion 35
		versionCode 2026091801
		versionName "ISSB-R 2.22.0"
		ndk { abiFilters 'arm64-v8a' }

		testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
		externalNativeBuild {
			cmake {
				targets 'iSSBLib', 'SDL2', 'SDL2_image', 'SDL2_mixer', 'SDL2_ttf', 'hidapi'
				arguments "-DANDROID_STL=c++_shared"
				// abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
				//abiFilters 'arm64-v8a'
			}
		}
	}

	sourceSets {
		main {
			java.srcDirs += "$buildDir/generated/sdl-java"
			assets.srcDirs += "../../../Assets"
		}
	}

	buildTypes {
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}
	}
	externalNativeBuild {
		cmake {
			path "src/main/cpp/CMakeLists.txt"
			version "3.22.1"
		}
	}
	compileOptions {
		sourceCompatibility JavaVersion.VERSION_1_8
		targetCompatibility JavaVersion.VERSION_1_8
	}
}

dependencies {
	implementation 'androidx.appcompat:appcompat:1.2.0'
	implementation 'com.google.android.material:material:1.1.0'
	implementation 'androidx.constraintlayout:constraintlayout:2.0.2'
	testImplementation 'junit:junit:4.+'
	androidTestImplementation 'androidx.test.ext:junit:1.1.2'
	androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
}

afterEvaluate {
	android.sourceSets.main.assets.srcDirs.each{println it}
}

// Keep the pinned SDL sources unchanged while adapting its Android glue to
// current receiver and PendingIntent requirements.
tasks.register('prepareSDLJava', Sync) {
	from '../../../External/SDL/SDL/android-project/app/src/main/java'
	into "$buildDir/generated/sdl-java"
	filter { String line ->
		line = line.replace('mContext.registerReceiver(mUsbBroadcast, filter);',
			'if (Build.VERSION.SDK_INT >= 33) mContext.registerReceiver(mUsbBroadcast, filter, Context.RECEIVER_NOT_EXPORTED); else mContext.registerReceiver(mUsbBroadcast, filter);')
		line = line.replace('mContext.registerReceiver(mBluetoothBroadcast, filter);',
			'if (Build.VERSION.SDK_INT >= 33) mContext.registerReceiver(mBluetoothBroadcast, filter, Context.RECEIVER_EXPORTED); else mContext.registerReceiver(mBluetoothBroadcast, filter);')
		line.replace('new Intent(HIDDeviceManager.ACTION_USB_PERMISSION), 0)',
			'new Intent(HIDDeviceManager.ACTION_USB_PERMISSION).setPackage(mContext.getPackageName()), PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= 31 ? PendingIntent.FLAG_MUTABLE : 0))')
	}
}
tasks.named('preBuild').configure { dependsOn 'prepareSDLJava' }
